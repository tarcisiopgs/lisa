[package]
name = "lisa-workspace"
version = "2.0.0"
edition = "2024"
description = "Workspace mode for Lisa: projects, git worktrees and interactive coding agents in one terminal UI."
license = "MIT"
repository = "https://github.com/tarcisiopgs/lisa"
publish = false

[[bin]]
name = "lisa-workspace"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
portable-pty = "0.9"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
terminput = "0.5"
terminput-crossterm = "0.4.11"
thiserror = "2.0.17"

[dev-dependencies]
insta = "1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
